# alfred — see .plan/deployment.md
#
# Push to main: test, build the image, deploy, then prove the deploy answers.
# Pull requests get everything except the deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit      # covers e2e/ too, which is how a CSS gap once surfaced
      - run: bun test               # bunfig.toml scopes the runner to tests/

      # Two engines. `chrome` is the channel the Chrome projects pin — real
      # Google Chrome, not bundled Chromium. `webkit` is Playwright's own build,
      # and the reason CI is the only place the WebKit projects can run: on
      # macOS 14 Playwright pins an older WebKit that its driver cannot talk to,
      # so the laptop runs Chrome only. See `.plan/changes-v11.md`.
      - run: bunx playwright install --with-deps chrome webkit
      - run: bunx playwright test

      # trace: 'retain-on-failure' is only worth setting if the traces escape.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7

      # Build the image here so a Dockerfile mistake fails in CI rather than
      # halfway through a deploy.
      - run: docker build -t alfred:ci --build-arg BUILD_SHA=${{ github.sha }} .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-main      # never two deploys at once
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # --ha=false: one machine. A spare cannot have the volume, and would sync
      # its own replica on a sixty-second lag. See .plan/deployment.md.
      - run: flyctl deploy --ha=false --build-arg BUILD_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # This replaces a Fly health check: it asks the public URL whether the app
      # answers AND whether it is the build we just shipped. A check could not
      # do the second, and cannot run at all while the machine is stopped.
      - name: smoke test
        run: |
          deployed=$(curl -sS --retry 10 --retry-all-errors --retry-delay 3 \
            --max-time 60 https://gg-alfred.fly.dev/api/status | jq -r .sha)
          echo "deployed sha: $deployed"
          echo "expected sha: ${{ github.sha }}"
          test "$deployed" = "${{ github.sha }}"
